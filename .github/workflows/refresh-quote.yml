name: Refresh reference prices

# The plan dates enter the committed history the day after they pass: six times
# a year, on the 20th of February/May/August/November and the 1st of April and
# October.
#
# This job **commits**, it does not publish. It is not what triggers the deploy
# (a GITHUB_TOKEN commit does not start other workflows, by design): the next
# morning's scheduled deploy takes it online. For a historical close from
# yesterday, waiting a day changes nothing.
#
# It also refreshes the committed quote.json, which serves as a fallback when
# the provider is down and lets `npm run dev` work without the secret.

on:
  schedule:
    # The 21st and the 2nd, so the close for the plan date always exists.
    - cron: "30 6 21 2,5,8,11 *"
    - cron: "30 6 2 4,10 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-quote
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Quote and history
        env:
          QUOTE_SYMBOL: ${{ secrets.QUOTE_SYMBOL }}
        run: node scripts/fetch-quote.mjs --history --soft

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- public/quote.json src/data/reference-prices.json; then
            echo "nothing to do: the numbers are the same"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/quote.json src/data/reference-prices.json
          git commit -m "chore: update reference closing prices"
          git push
