name: Refresh reference prices

# Le date del piano entrano nello storico committato il giorno dopo che sono
# passate: sei volte l'anno, il 20 di febbraio/maggio/agosto/novembre e il 1 di
# aprile e di ottobre.
#
# Questo giro **committa**, non pubblica. Il deploy non lo fa scattare lui (un
# commit di GITHUB_TOKEN non fa partire altri workflow, di proposito): lo porta
# online il deploy schedulato del mattino dopo. Per una chiusura storica di
# ieri, aspettare un giorno non cambia niente.
#
# Aggiorna anche il quote.json committato, che serve come ripiego quando il
# fornitore non risponde e per far girare `npm run dev` senza il secret.

on:
  schedule:
    # Il 21 e il 2, cosi' la chiusura della data del piano c'e' sempre.
    - cron: "30 6 21 2,5,8,11 *"
    - cron: "30 6 2 4,10 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-quote
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Quotazione e storico
        env:
          QUOTE_SYMBOL: ${{ secrets.QUOTE_SYMBOL }}
        run: node scripts/fetch-quote.mjs --history --soft

      - name: Commit se qualcosa e' cambiato
        run: |
          if git diff --quiet -- public/quote.json src/data/reference-prices.json; then
            echo "niente da fare: i numeri sono gli stessi"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/quote.json src/data/reference-prices.json
          git commit -m "chore: aggiorna le chiusure di riferimento"
          git push
