name: Deploy

# The site is static and lives on GitHub Pages. The build does three things in
# order: fetch the quote (the symbol comes from the secret and never leaves the
# runner), check types and tests, and publish dist/.
#
# The schedule lives here rather than in a separate workflow for a specific
# reason: a commit made with GITHUB_TOKEN **does not trigger other workflows**,
# so a job that refreshes the price and expects the deploy to start on its own
# would never publish anything. `quote.json` is regenerated inside the runner on
# every deploy, so all that is needed is for the deploy to run again: the deploy
# itself is what is scheduled.

on:
  push:
    branches: [main]
  schedule:
    # 06:00 UTC Tuesday to Saturday: covers the Monday to Friday closes.
    - cron: "0 6 * * 2-6"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time: two pushes close together must not publish out of order.
# The run in flight is left to finish, so a half-built version is never online.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # On the schedule the event points at the commit from when the cron was
      # registered: without `ref` the nightly run would republish an old version
      # of the site every time.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # --soft: if the provider does not answer, the deploy carries on with the
      # quote.json already in the repo. Yesterday's price beats a broken site,
      # and the page always says which day the number it shows is from.
      - name: Quote
        env:
          QUOTE_SYMBOL: ${{ secrets.QUOTE_SYMBOL }}
        run: node scripts/fetch-quote.mjs --soft

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
