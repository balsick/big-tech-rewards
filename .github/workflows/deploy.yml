name: Deploy

# The site is static and lives on GitHub Pages. The build does three things in
# order: fetch the quote (the symbol comes from the secret and never leaves the
# runner), check types and tests, and publish dist/.
#
# The schedule lives here rather than in a separate workflow for a specific
# reason: a commit made with GITHUB_TOKEN **does not trigger other workflows**,
# so a job that refreshes the price and expects the deploy to start on its own
# would never publish anything. `quote.json` is regenerated inside the runner on
# every deploy, so all that is needed is for the deploy to run again: the deploy
# itself is what is scheduled.

on:
  push:
    branches: [main]
  schedule:
    # 22:37 UTC, Monday to Friday: **after the close**, on the day of it.
    #
    # It used to be 06:00 the next morning, which read well and did not work:
    # a scheduled workflow is best effort, and the three runs that existed
    # started 4h26m, 4h41m and 5h05m late — every single one. So the price
    # arrived at one in the afternoon, and the site served the previous close
    # all morning, which is the one thing this schedule is for.
    #
    # Two changes, and both matter.
    #
    # **The hour.** 22:37 UTC is past the New York close in both halves of the
    # year: the close is 20:00 UTC on summer time and 21:00 UTC on winter time,
    # and cron does not follow daylight saving. That leaves a margin of 1h37m
    # in the worst case, and a delay of five hours lands at 03:37 — deep in the
    # night here, hours before anyone opens the page. The lateness stops being
    # something to fix and becomes something that does not matter.
    #
    # **The minute.** `0` is the most contended minute there is: almost
    # everyone writes the round hour, and the queue forms exactly there. 37 is
    # not magic and guarantees nothing — best effort stays best effort — but it
    # asks for a slot nobody else is asking for.
    - cron: "37 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time: two pushes close together must not publish out of order.
# The run in flight is left to finish, so a half-built version is never online.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # On the schedule the event points at the commit from when the cron was
      # registered: without `ref` the nightly run would republish an old version
      # of the site every time.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # --soft: if the provider does not answer, the deploy carries on with the
      # quote.json already in the repo. Yesterday's price beats a broken site,
      # and the page always says which day the number it shows is from.
      - name: Quote
        env:
          QUOTE_SYMBOL: ${{ secrets.QUOTE_SYMBOL }}
        run: node scripts/fetch-quote.mjs --soft

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
